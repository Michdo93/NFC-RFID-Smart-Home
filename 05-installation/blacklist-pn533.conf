# /etc/modprobe.d/blacklist-pn533.conf  (Kapitel 5)
#
# Der Linux-Kernel bringt einen eigenen NFC-Treiber für PN533-basierte Leser mit.
# Er erkennt auch den ACR122U und belegt ihn – dann sehen weder pcscd noch nfcpy
# den Leser. Wir sperren die Module und nutzen den Leser über PC/SC (pcscd + libccid).
#
#   sudo cp 05-installation/blacklist-pn533.conf /etc/modprobe.d/
#   sudo modprobe -r pn533_usb pn533 nfc
#   sudo systemctl restart pcscd
blacklist pn533_usb
blacklist pn533
blacklist nfc
