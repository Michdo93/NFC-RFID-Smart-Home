# Kapitel 20 – Mosquitto für das NFC-System
# Datei: /etc/mosquitto/conf.d/nfc.conf
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Persistenz (retained-Zustände überstehen einen Neustart) schaltet die
# Debian-Vorgabe /etc/mosquitto/mosquitto.conf bereits ein – hier NICHT
# wiederholen, sonst meldet Mosquitto einen doppelten Eintrag.
#
# Schreibbefehle an die ESP32 enthalten Kartenschlüssel. Wer das Netz nicht
# kontrolliert, nimmt TLS: nfc-tls.conf.example und zertifikate_erzeugen.sh (Kapitel 20).
