; Kapitel 15–17 – NFC-Leser mit ESP32 und PN532 oder RC522
;
;   pio run -e pn532 -t upload        PN532 V3 über I2C (DIP-Schalter: I2C)
;   pio run -e rc522 -t upload        RC522 über SPI
;   pio device monitor
;
; Vorher: include/secrets.example.h nach include/secrets.h kopieren und ausfüllen
; (secrets.h ist gitignored). Key A erzeugt 15-esp32-hardware/secrets_erzeugen.py.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0

[env:pn532]
build_flags = -D LESER_PN532
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit PN532 @ ^1.3

[env:rc522]
build_flags = -D LESER_RC522
lib_deps =
    ${env.lib_deps}
    miguelbalboa/MFRC522 @ ^1.4
