[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nfcsmarthome"
version = "1.0.0"
description = "Begleitbibliothek zum Buch: Smart Home & NFC/RFID – mit Python 3, ESP32, openHAB, MQTT und REST"
authors = [{ name = "Michael Christian Dörflinger" }]
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0", "paho-mqtt>=2.0", "aiohttp>=3.9"]

[project.optional-dependencies]
pcsc = ["pyscard>=2.0"]

[tool.setuptools]
packages = ["nfcsmarthome", "nfcsmarthome.readers"]
